<!DOCTYPE html>
<html lang="sv" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daglig Inventering</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        };
    </script>

    <style>
        /* --- CSS STYLING --- */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .thinking-pulse { animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }

        * { -webkit-tap-highlight-color: transparent; }
        .safe-area-pb { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>

<body class="h-screen flex flex-col overflow-hidden bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100">

    <header class="flex-none bg-slate-100 border-b border-slate-200 p-4 flex justify-between items-center shadow-md z-10 dark:bg-slate-800 dark:border-slate-700">
        <h1 class="text-xl font-semibold text-slate-900 tracking-wide dark:text-slate-100">Kvällsinventering</h1>
        <div id="currentDate" class="text-sm text-slate-500 dark:text-slate-400"></div>
    </header>

    <main id="mainContainer" class="flex-1 overflow-y-auto p-4 pb-28 relative">
        </main>

    <button onclick="app.showForm()" id="fab" class="fixed bottom-20 right-6 bg-indigo-600 hover:bg-indigo-500 text-white p-4 rounded-full shadow-lg shadow-indigo-900/50 transition-transform transform hover:scale-105 active:scale-95 z-30 hidden">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
    </button>

    <nav class="fixed bottom-2 left-2 right-2 bg-slate-100 border border-slate-200 flex justify-around items-center h-16 z-20 safe-area-pb rounded-2xl shadow-lg dark:bg-slate-800 dark:border-slate-700">
        <button onclick="app.navigate('home')" class="nav-btn flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-slate-900 active:text-indigo-400 transition-colors dark:hover:text-white" data-target="home">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
            </svg>
            <span class="text-xs">Hem</span>
        </button>
        <button onclick="app.navigate('history')" class="nav-btn flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-slate-900 active:text-indigo-400 transition-colors dark:hover:text-white" data-target="history">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span class="text-xs">Historik</span>
        </button>
        <button onclick="app.navigate('settings')" class="nav-btn flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-slate-900 active:text-indigo-400 transition-colors dark:hover:text-white" data-target="settings">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <span class="text-xs">Inställningar</span>
        </button>
    </nav>

    <input type="file" id="importInput" style="display: none;" onchange="app.handleImport(this)" accept=".json, .txt">

    <div id="aiModal" class="fixed inset-0 bg-black/80 hidden z-50 flex items-end sm:items-center justify-center p-4 backdrop-blur-sm transition-opacity duration-300">
        <div class="bg-white rounded-t-2xl sm:rounded-2xl w-full max-w-md max-h-[85vh] flex flex-col shadow-2xl border border-indigo-500/30 dark:bg-slate-800">
            <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-indigo-50 rounded-t-2xl dark:bg-indigo-900/20 dark:border-slate-700">
                <h3 class="text-lg font-bold text-slate-900 flex items-center gap-2 dark:text-white">
                    <span>✨</span> AI-Reflektion
                </h3>
                <button onclick="app.closeAiModal()" class="text-slate-400 hover:text-slate-900 dark:hover:text-white p-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div id="aiContent" class="p-6 overflow-y-auto text-slate-700 whitespace-pre-wrap leading-relaxed text-sm dark:text-slate-200 font-sans">
                </div>
            <div class="p-4 border-t border-slate-200 bg-slate-50 rounded-b-2xl dark:border-slate-700 dark:bg-slate-900/50">
                <button onclick="app.closeAiModal()" class="w-full py-3 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-medium transition-colors">Stäng</button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-emerald-600 text-white px-6 py-3 rounded-full shadow-xl opacity-0 transition-opacity duration-300 pointer-events-none z-50 font-medium whitespace-nowrap">
        Sparat!
    </div>

    <script>
        const questions = [
            { id: 'q1', text: "Har jag harmats?", placeholder: "Var jag arg, irriterad eller bitter?" },
            { id: 'q2', text: "Varit självisk?", placeholder: "Satte jag mina behov före andras på ett orättvist sätt?" },
            { id: 'q3', text: "Varit oärlig?", placeholder: "Ljugit, överdrivit eller undanhållit sanningen?" },
            { id: 'q4', text: "Varit rädd?", placeholder: "Lät jag rädsla styra mina handlingar?" },
            { id: 'q5', text: "Skyldig nån en ursäkt?", placeholder: "Har jag sårat någon?" },
            { id: 'q6', text: "Behållit nåt för mig själv?", placeholder: "Hemligheter eller känslor jag borde dela?" },
            { id: 'q7', text: "Vänlig mot alla?", placeholder: "Hur bemötte jag min omgivning?" },
            { id: 'q8', text: "Vad kunde jag gjort bättre?", placeholder: "Finns det något jag vill ändra på till imorgon?" },
            { id: 'q9', text: "Tänkte jag mest på mig själv?", placeholder: "Var jag självupptagen?" },
            { id: 'q10', text: "Hur bidrog jag till andra?", placeholder: "Hur var jag till nytta idag?" },
            { id: 'q11', text: "Har jag sett dystert på dagen?", placeholder: "Vi måste vara noga med att inte glida in i sjukligt dystra funderingar, för det skulle minska vår förmåga att vara till nytta." },
            { id: 'q12', text: "Vad kommer till mig?", placeholder: "Nu ber vi Gud om förlåtelse och vägledning. Vad bör jag vidta för åtgärder för att bättra mig?" }
        ];

        const app = {
            data: {},
            apiKey: '',
            currentView: 'home',
            theme: 'dark',
            
            init() {
                const storedData = localStorage.getItem('dailyInventoryData');
                if (storedData) this.data = JSON.parse(storedData);

                const storedKey = localStorage.getItem('geminiApiKey');
                if (storedKey) this.apiKey = storedKey;

                const storedTheme = localStorage.getItem('dailyInventoryTheme');
                this.setTheme(storedTheme || 'dark', false);

                const options = { weekday: 'long', day: 'numeric', month: 'long' };
                document.getElementById('currentDate').textContent = new Date().toLocaleDateString('sv-SE', options);

                this.navigate('home');
            },

            // RÄKNA STREAK (Dagar i rad)
            calculateStreak() {
                const dates = Object.keys(this.data).sort().reverse();
                if (dates.length === 0) return 0;

                let streak = 0;
                const today = new Date().setHours(0,0,0,0);
                const yesterday = new Date(today - 86400000).setHours(0,0,0,0);
                
                // Kolla om senaste inlägget är idag eller igår
                const lastEntryDate = new Date(dates[0]).setHours(0,0,0,0);
                if (lastEntryDate !== today && lastEntryDate !== yesterday) {
                    return 0; 
                }

                // Räkna bakåt
                let currentDateCheck = lastEntryDate;
                for (let i = 0; i < dates.length; i++) {
                    const entryDate = new Date(dates[i]).setHours(0,0,0,0);
                    if (entryDate === currentDateCheck) {
                        streak++;
                        currentDateCheck -= 86400000; // Gå tillbaka en dag (24h)
                    } else {
                        break; // Streaken bruten
                    }
                }
                return streak;
            },

            setTheme(theme, save = true) {
                this.theme = theme;
                const root = document.documentElement;
                if (theme === 'dark') root.classList.add('dark');
                else root.classList.remove('dark');
                if (save) localStorage.setItem('dailyInventoryTheme', theme);
                this.updateThemeToggleUI();
            },

            updateThemeToggleUI() {
                const toggle = document.getElementById('themeToggle');
                const label = document.getElementById('themeLabelText');
                if (toggle) toggle.checked = this.theme === 'dark';
                if (label) label.textContent = this.theme === 'dark' ? 'Mörkt läge' : 'Ljust läge';
            },

            saveData() {
                localStorage.setItem('dailyInventoryData', JSON.stringify(this.data));
            },

            saveApiKey(key) {
                this.apiKey = key.trim();
                localStorage.setItem('geminiApiKey', this.apiKey);
                this.showToast("API-nyckel sparad");
                this.navigate('settings');
            },

            getTodayKey() {
                return new Date().toISOString().split('T')[0];
            },

            showToast(message) {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.classList.remove('opacity-0');
                setTimeout(() => toast.classList.add('opacity-0'), 2500);
            },

            navigate(view) {
                this.currentView = view;
                const container = document.getElementById('mainContainer');
                const fab = document.getElementById('fab');
                
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    const target = btn.getAttribute('data-target');
                    const isActive = view === target || (view.startsWith('details') && target === 'history');
                    btn.classList.toggle('text-indigo-400', isActive);
                    btn.classList.toggle('text-slate-400', !isActive);
                });

                window.scrollTo(0, 0);
                container.innerHTML = '';

                if (view === 'home') {
                    this.renderHome(container);
                    fab.classList.remove('hidden');
                } else if (view === 'form') {
                    this.renderForm(container);
                    fab.classList.add('hidden');
                } else if (view === 'history') {
                    this.renderHistory(container);
                    fab.classList.remove('hidden');
                } else if (view.startsWith('details:')) {
                    this.renderDetails(container, view.split(':')[1]);
                    fab.classList.add('hidden');
                } else if (view === 'settings') {
                    this.renderSettings(container);
                    fab.classList.add('hidden');
                }
            },

            renderHome(container) {
                const today = this.getTodayKey();
                const hasEntryToday = !!this.data[today];
                const streak = this.calculateStreak();

                let html = `
                    <div class="fade-in space-y-6">
                        <div class="bg-white rounded-2xl p-6 shadow-lg border border-slate-200 text-center dark:bg-slate-800 dark:border-slate-700">
                            <h2 class="text-2xl font-bold text-slate-900 mb-2 dark:text-white">Välkommen</h2>
                            
                            <div class="flex items-center justify-center gap-2 mb-6 text-slate-500 dark:text-slate-400">
                                <span class="text-orange-500 text-xl">🔥</span>
                                <span class="font-semibold text-lg">${streak}</span> dagar i rad
                            </div>
                            
                            ${hasEntryToday 
                                ? `<div class="bg-emerald-50 border border-emerald-200 p-6 rounded-xl mb-6 text-emerald-900 dark:bg-emerald-900/20 dark:border-emerald-700/30 dark:text-emerald-100">
                                    <div class="flex justify-center mb-3">
                                        <div class="h-12 w-12 rounded-full bg-emerald-200 flex items-center justify-center text-emerald-700 dark:bg-emerald-600/20 dark:text-emerald-400">
                                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
                                        </div>
                                    </div>
                                    <p class="italic leading-relaxed text-lg font-medium mb-4">"Bra jobbat. Dagens inventering är klar."</p>
                                    <button onclick="app.navigate('details:${today}')" class="text-sm text-indigo-600 hover:text-indigo-500 flex items-center justify-center gap-2 mx-auto py-2 px-4 bg-white/50 hover:bg-white rounded-lg transition-colors dark:text-indigo-300 dark:bg-black/20 dark:hover:bg-black/30">
                                        <span>Granska svaren</span> <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>
                                    </button>
                                   </div>`
                                : `<button onclick="app.showForm()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-4 px-6 rounded-xl shadow-lg shadow-indigo-900/50 transition-all transform active:scale-95 flex items-center justify-center gap-2">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>
                                    Starta Inventering
                                   </button>`
                            }
                        </div>
                        <div class="mt-8">
                            <h3 class="text-lg font-semibold text-slate-700 mb-4 px-2 dark:text-slate-300">Dagens tanke</h3>
                            <div class="bg-slate-100 p-4 rounded-xl border-l-4 border-indigo-500 italic text-slate-600 dark:bg-slate-800/50 dark:text-slate-400">
                                "Det outforskade livet är inte värt att leva." <br><span class="text-xs not-italic mt-2 block text-slate-400">– Sokrates</span>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML = html;
            },

            showForm() { this.navigate('form'); },

            renderForm(container) {
                const today = this.getTodayKey();
                const existingData = this.data[today] || {};
                let formHtml = `
                    <div class="fade-in max-w-lg mx-auto pb-10">
                        <div class="flex items-center justify-between mb-6">
                            <h2 class="text-2xl font-bold text-slate-900 dark:text-white">Dagens frågor</h2>
                            <button onclick="app.navigate('home')" class="text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white">Avbryt</button>
                        </div>
                        <form id="inventoryForm" onsubmit="app.handleFormSubmit(event)">
                `;
                questions.forEach((q, index) => {
                    const val = existingData[q.id] || '';
                    formHtml += `
                        <div class="mb-6 bg-white p-5 rounded-xl border border-slate-200 shadow-sm dark:bg-slate-800 dark:border-slate-700">
                            <label class="block text-lg font-medium text-indigo-700 mb-3 leading-tight dark:text-indigo-300">${index + 1}. ${q.text}</label>
                            <textarea name="${q.id}" class="w-full bg-slate-50 text-slate-900 rounded-lg p-3 border border-slate-300 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition-all h-24 placeholder-slate-400 resize-none dark:bg-slate-900 dark:text-slate-100 dark:border-slate-600 dark:placeholder-slate-600" placeholder="${q.placeholder}">${val}</textarea>
                        </div>
                    `;
                });
                formHtml += `
                            <div class="fixed bottom-20 left-0 right-0 p-4 bg-slate-100/95 backdrop-blur-md border-t border-slate-200 z-30 flex justify-center dark:bg-slate-900/90 dark:border-slate-700">
                                <button type="submit" class="w-full max-w-md bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-8 rounded-xl shadow-lg transform active:scale-95 transition-all">Spara Inventering</button>
                            </div>
                        </form>
                    </div>
                `;
                container.innerHTML = formHtml;
            },

            handleFormSubmit(e) {
